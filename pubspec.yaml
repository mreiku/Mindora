name: mindora
description: "Socializing app for students"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_hooks: any
  hooks_riverpod: any
  line_awesome_flutter: ^3.0.1
  flutter_screenutil: ^5.9.3
  animated_theme_switcher: ^2.0.10

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter:

  uses-material-design: true

  assets:
    - assets/logo.gif
    - assets/mindora.png
    - assets/bila.jpg
    - assets/icon.png 

  fonts:
    - family: Jomhuria
      fonts:
        - asset: fonts/Jomhuria-Regular.ttf

    - family: Jost
      fonts:
        - asset: fonts/Jost-VariableFont_wght.ttf
